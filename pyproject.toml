[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rheon"
version = "0.1.0"
description = "Vibe-coded RISC-V core and testbench"
authors = [
    {name = "Stuart Alldred", email = "stuartalldred@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cocotb>=2.0",
    "noodle-bucket>=2,<3",
    "forastero @ git+https://github.com/Intuity/forastero.git",
    "packtype",
    "pydantic>=2.8.2",
    "pyelftools>=0.31",
    "PyYAML>=6.0.2",
    "rich>=13.9.4",
    "lome @ git+https://github.com/Alldred/lome.git",
    "tibbar @ git+https://github.com/Alldred/tibbar.git",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.8.0",
    "pytest>=8.0.1",
    "pytest-cov>=4.1.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tb", "testcases"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# python-constraint 1.4.0 on PyPI is only a .tar.bz2 sdist; uv 0.12+ rejects it.
override-dependencies = [
    "python-constraint @ git+https://github.com/python-constraint/python-constraint.git@1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
